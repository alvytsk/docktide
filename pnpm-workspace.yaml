# Not a JS monorepo; this file only carries pnpm settings.
# Keep these overrides in lockstep with the `vite-plus` version in package.json
# (`pnpm exec vp toolchain` shows the bundled vitest version).
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

# The aliased vite-plus-core reports its own version (1.3.0), not the bundled
# Vite version, so plugins' `vite: ^8` peer ranges look unmet. Allow exactly it.
peerDependencyRules:
  allowedVersions:
    vite: 1.3.0
