# see https://github.com/rust-lang/cargo/issues/8519
name = "docktide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
docktide-core.workspace = true
tauri.workspace = true

[lints]
workspace = true
